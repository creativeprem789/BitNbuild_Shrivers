version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: task_harness_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_harness
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_harness"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: task_harness_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task_harness_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/task_harness
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ROUTER_MODEL=${ROUTER_MODEL:-gemini-2.5-flash}
      - AGENT_MODEL=${AGENT_MODEL:-gemini-2.5-flash}
      - CALENDAR_API_BASE_URL=${CALENDAR_API_BASE_URL:-https://httpbin.org/anything/calendar/events}
      - CALENDAR_API_KEY=${CALENDAR_API_KEY:-sandbox_key_demo}
      - CORS_ORIGINS=["*"]
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./backend/app:/app/app:ro

volumes:
  postgres_data:
